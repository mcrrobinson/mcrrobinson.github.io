<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Page Transition Using BarbaJS & GSAP</title>
    <link rel="stylesheet" href="/static/css/main_page_main.css" />
</head>

<body data-barba="wrapper">
    <div class="load-container">
        <div class="loading-screen"></div>
    </div>

    <main data-barba="container" data-barba-namespace="about-section">
        <div class="header">
            <h1 class="animate-this">
                Social
            </h1>
        </div>
        <div>
            <div class="row">
                <div id="column1" class="animate-this imageColumn">Instagram<a
                        href="https://www.instagram.com/mattrobinson31/"><img class="circleImage"
                            src="/static/img/instagram.png"></div></a>
                <div id="column2" class="animate-this imageColumn">Github<a href="https://github.com/mcrrobinson"><img
                            class="circleImage" src="/static/img/github.png"></div></a>
                <div id="column3" class="animate-this imageColumn">LinkedIn<a
                        href="https://www.linkedin.com/in/matthew-robinson-2272581aa/"><img class="circleImage"
                            src="/static/img/linkedin.png"></div></a>
                <div id="column4" class="animate-this imageColumn">Steam<a
                        href="https://steamcommunity.com/id/MrDitto/"><img class="circleImage"
                            src="/static/img/steam.png"></div></a>
                <div id="column4" class="animate-this imageColumn">Skype<a href="skype:live:mrsteamditto?chat"><img
                            class="circleImage" src="/static/img/skype.png"></div></a>
                <div id="column4" class="animate-this imageColumn">Mail<a href="mailto:mcrrobinson@gmail.com"><img
                            class="circleImage" src="/static/img/email.png"></div></a>
            </div>
        </div>
    </main>
</body>
<script src="/static/js/jquery.min.js"></script>
<script src="https://unpkg.com/@barba/core"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.2.4/gsap.min.js"></script>
<script src="/static/js/home_page_page_transition.js"></script>

</html>
