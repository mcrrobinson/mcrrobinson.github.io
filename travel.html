<html>
    <head>
        <title>Travels</title>
    </head>
    <body>
    <p id="demo"></p>
    <script>
        fetch("https://www.gov.uk/guidance/red-amber-and-green-list-rules-for-entering-england", {
            "headers": {
                "accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9",
                "accept-language": "en-GB,en-US;q=0.9,en;q=0.8",
                "cache-control": "max-age=0",
                "if-none-match": "W/\"53b6b8326a722bee2e0eb9101637e722\"",
                "sec-fetch-dest": "document",
                "sec-fetch-mode": "navigate",
                "sec-fetch-site": "same-origin",
                "sec-fetch-user": "?1",
                "sec-gpc": "1",
                "upgrade-insecure-requests": "1"
            },
            "referrer": "https://www.gov.uk/guidance/red-amber-and-green-list-rules-for-entering-england",
            "referrerPolicy": "strict-origin-when-cross-origin",
            "body": null,
            "method": "GET",
            "mode": "cors",
            "credentials": "include"
        })
        .then(x => x.text())
        .then(y => document.getElementById("demo").innerHTML = y);
    </script>
    </body>
</html>
