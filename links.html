<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Social Links | Matt Robinson</title>
        <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@100;200;300;400;600&display=swap" rel="stylesheet">
        <link href="main.css" rel="stylesheet" type="text/css">
    </head>

    <body data-barba="wrapper">
        <div class="load-container">
            <div class="loading-screen"></div>
        </div>
    
        <main data-barba="container" data-barba-namespace="links-section">
            <div class="header">
                <h1 class="page-title">
                    Links
                </h1>
            </div>
            
            <div>
                <div class="row animate-this"> 
                    <div id="github">
                        <a href="https://github.com/mcrrobinson">
                            <img class="circleImage" src="https://raw.githubusercontent.com/devicons/devicon/refs/tags/v2.16.0/icons/github/github-original.svg" alt="GitHub">
                            <span>GitHub</span>
                        </a>
                    </div>
                    <div id="linkedin">
                        <a href="https://www.linkedin.com/in/matthew-robinson-2272581aa/">
                            <img class="circleImage" src="https://raw.githubusercontent.com/devicons/devicon/refs/tags/v2.16.0/icons/linkedin/linkedin-original.svg" alt="LinkedIn">
                            <span>LinkedIn</span>
                        </a>
                    </div>
                    <div id="email">
                        <a href="mailto:mcrrobinson@gmail.com">
                            <img class="circleImage" src="https://raw.githubusercontent.com/devicons/devicon/refs/tags/v2.16.0/icons/googlecloud/googlecloud-original.svg" alt="Email">
                            <span>Mail</span>
                        </a>
                    </div>
                </div>
            </div>

        </main>

        <script src="js/jquery.min.js"></script>
        <script src='js/jquery.velocity.min.js'></script>
        <script src='js/velocity.ui.min.js'></script>
        <script src="js/script.js"></script>
        <script src="https://unpkg.com/@barba/core"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.2.4/gsap.min.js"></script>
        <script src="js/page_transition.js"></script>
    </body>
</html>
